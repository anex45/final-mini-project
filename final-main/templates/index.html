<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Interview System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Python Interview System</h1>
        
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h2 class="mb-4">Welcome to the Python Interview</h2>
            <p class="lead">This system will ask you Python programming questions and evaluate your answers.</p>
            <div class="mb-3">
                <label for="candidate-name" class="form-label">Enter your name to begin:</label>
                <input type="text" class="form-control" id="candidate-name" placeholder="Your Name">
            </div>
            <button id="start-btn" class="btn btn-primary">Start Interview</button>
        </div>
        
        <!-- Category Selection Screen -->
        <div id="category-screen" class="screen">
            <h2 class="mb-4">Select a Question Category</h2>
            <div id="categories-container" class="list-group">
                <!-- Categories will be loaded here -->
            </div>
        </div>
        
        <!-- Question Screen -->
        <div id="question-screen" class="screen">
            <h2 class="mb-4">Question</h2>
            <div class="card mb-4">
                <div class="card-body">
                    <p id="question-text" class="lead"></p>
                </div>
            </div>
            <div class="mb-3">
                <label for="answer-input" class="form-label">Your Answer:</label>
                <textarea class="form-control" id="answer-input" rows="6"></textarea>
            </div>
            <button id="submit-btn" class="btn btn-primary">Submit Answer</button>
        </div>
        
        <!-- Feedback Screen -->
        <div id="feedback-screen" class="screen">
            <h2 class="mb-4">Feedback</h2>
            <div class="card mb-4">
                <div class="card-body">
                    <h3>Score: <span id="score-value"></span>%</h3>
                    <p id="feedback-text"></p>
                </div>
            </div>
            <div class="d-flex justify-content-between">
                <button id="next-question-btn" class="btn btn-primary">Next Question</button>
                <button id="end-interview-btn" class="btn btn-secondary">End Interview</button>
            </div>
        </div>
        
        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <h2 class="mb-4">Interview Results</h2>
            <div id="results-summary" class="card mb-4">
                <div class="card-body">
                    <!-- Summary will be loaded here -->
                </div>
            </div>
            <h3>Detailed Results</h3>
            <div id="results-details">
                <!-- Detailed results will be loaded here -->
            </div>
            <button id="restart-btn" class="btn btn-primary mt-4">Start New Interview</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="/static/js/main.js"></script>
</body>
</html>
